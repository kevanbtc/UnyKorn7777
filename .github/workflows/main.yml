name: Deploy Web (GitHub Pages)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
      NEXT_PUBLIC_BRAND: ${{ vars.NEXT_PUBLIC_BRAND }}
      NEXT_PUBLIC_NETWORK_LABEL: ${{ vars.NEXT_PUBLIC_NETWORK_LABEL }}
      NEXT_PUBLIC_HIDE_CHECK_NAV: ${{ vars.NEXT_PUBLIC_HIDE_CHECK_NAV }}
      GITHUB_PAGES: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies (apps/web)
        working-directory: apps/web
        run: |
          npm ci || npm install

      - name: Build static web
        working-directory: apps/web
        run: |
          npm run build || npx next build

      - name: Ensure CNAME for custom domain
        run: |
          echo "${{ vars.PAGES_CNAME || 'unykorn.org' }}" > apps/web/out/CNAME

      - name: Copy XRPL TOML to output (if present)
        run: |
          if [ -f public/.well-known/xrp-ledger.toml ]; then
            mkdir -p apps/web/out/.well-known
            cp public/.well-known/xrp-ledger.toml apps/web/out/.well-known/xrp-ledger.toml
            echo "xrp-ledger.toml copied"
          else
            echo "xrp-ledger.toml not found; skipping"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
